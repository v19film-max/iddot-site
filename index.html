<body data-page="home">

<header class="hd" data-top="true">
  <a class="hd__brand" href="index.html" aria-label="iddot 홈">
    <span class="mark" aria-hidden="true">
      <img class="mark__dot" src="assets/mark-dot.webp" alt="" width="64" height="64">
      <img class="mark__flower" src="assets/mark-flower.webp" alt="" width="64" height="64">
    </span>
    <span class="wordmark"><img src="assets/logo-nav.webp" alt="iddot" draggable="false"></span>
  </a>
  <nav class="hd__nav" aria-label="주 메뉴">
    <a href="index.html#work" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main id="main">
  <!-- 첫 화면: 쇼릴 (지금은 미리보기로 만든 임시 쇼릴, 나중에 파일만 교체) -->
  <section class="hero" aria-label="iddot 쇼릴">
    <video class="hero__video" id="heroVideo" muted playsinline loop preload="auto"
           poster="assets/hero-reel-poster.jpg" aria-hidden="true"
           data-src-desktop="assets/hero-reel.mp4?v=5" data-src-mobile="assets/hero-reel-mobile.mp4?v=5"></video>
    <div class="hero__shade" aria-hidden="true"></div>
    <button class="hero__now" id="heroNow" type="button">
      <span class="hero__now-label">Now playing</span>
      <span class="hero__now-title" id="heroNowTitle"></span>
      <span class="hero__now-go" aria-hidden="true">View</span>
    </button>
    <div class="hero__steps" id="heroSteps" aria-hidden="true"></div>
  </section>

  <p class="tagline">Every identity starts as a dot.</p>

  <section class="work" id="work" aria-label="작업 목록">
    <div class="work__bar">
      <div class="tabs" role="tablist" aria-label="작업 분류" id="workTabs">
        <button class="tab is-on" role="tab" aria-selected="true"  data-filter="selected">Selected</button>
        <button class="tab"       role="tab" aria-selected="false" data-filter="mv">M/V</button>
        <button class="tab"       role="tab" aria-selected="false" data-filter="film">Film</button>
        <button class="tab"       role="tab" aria-selected="false" data-filter="art">Art</button>
        <button class="tab"       role="tab" aria-selected="false" data-filter="digital">Digital</button>
        <button class="tab"       role="tab" aria-selected="false" data-filter="all">All</button>
        <span class="tabs__bar" aria-hidden="true"></span>
      </div>
      <p class="work__count" aria-live="polite"><span id="workCount">08</span> Works</p>
    </div>

    <div class="grid" id="workGrid"></div>
    <p class="work__empty" id="workEmpty" hidden>해당 분류의 작업이 아직 없습니다.</p>
  </section>
</main>

  </div>
